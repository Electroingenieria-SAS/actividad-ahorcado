<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electroingeniería - Desafío Corporativo</title>
  <!-- Cliente JS Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0033A0;
      --primary-dark: #002266;
      --yellow: #FFC700;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 520px;
      width: 100%;
      text-align: center;
      border-top: 6px solid var(--primary);
    }

    .brand-header {
      margin-bottom: 2rem;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      margin: 0;
      text-transform: lowercase;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: var(--primary);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--yellow);
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-transform: lowercase;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 51, 160, 0.3);
    }

    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 1rem;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.99);
    }

    #game-screen, #end-screen { display: none; }

    .game-progress {
      font-size: 0.85rem;
      color: var(--yellow);
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .clue {
      color: var(--muted);
      font-style: italic;
      margin-bottom: 1.5rem;
      min-height: 48px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    #svg-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem auto;
    }

    line, circle {
      stroke: var(--text);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
    }

    .figure-part { display: none; }

    .word-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .letter-slot {
      border-bottom: 3px solid var(--yellow);
      width: 30px;
      height: 40px;
      font-size: 1.7rem;
      font-weight: bold;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .key {
      background: #0f172a;
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px 13px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .key:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
    }

    .key:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .key.correct {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .key.wrong {
      background: var(--error);
      border-color: var(--error);
      color: white;
    }

    .status {
      margin-top: 1.5rem;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .summary-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.5rem;
      margin: 1.5rem 0;
    }

    .summary-score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--yellow);
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand-header">
    <h1 class="brand-title">electro<span>ingeniería</span></h1>
    <div class="brand-subtitle">trabajando con buena energía</div>
  </div>

  <!-- PANTALLA 1: REGISTRO -->
  <div id="login-screen">
    <form id="login-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="proceso">Proceso</label>
        <select id="proceso" required>
          <option value="" disabled selected>Seleccione un proceso...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="subproceso">Subproceso</label>
        <select id="subproceso" disabled required>
          <option value="" disabled selected>Seleccione primero un proceso...</option>
        </select>
      </div>

      <button type="submit" class="btn" id="start-btn">Iniciar Desafío</button>
    </form>
  </div>

  <!-- PANTALLA 2: JUEGO -->
  <div id="game-screen">
    <div class="game-progress" id="game-progress">Palabra 1 de 5</div>
    <div class="clue" id="clue">Cargando pista...</div>

    <svg id="svg-container" viewBox="0 0 100 100">
      <line x1="10" y1="95" x2="90" y2="95" />
      <line x1="30" y1="95" x2="30" y2="5" />
      <line x1="30" y1="5" x2="70" y2="5" />
      <line x1="70" y1="5" x2="70" y2="20" />

      <circle cx="70" cy="28" r="8" class="figure-part" />
      <line x1="70" y1="36" x2="70" y2="60" class="figure-part" />
      <line x1="70" y1="45" x2="55" y2="55" class="figure-part" />
      <line x1="70" y1="45" x2="85" y2="55" class="figure-part" />
      <line x1="70" y1="60" x2="55" y2="80" class="figure-part" />
      <line x1="70" y1="60" x2="85" y2="80" class="figure-part" />
    </svg>

    <div class="word-display" id="word-display"></div>
    <div class="keyboard" id="keyboard"></div>
    <div class="status" id="status"></div>
    <button class="btn" id="next-btn" onclick="nextWord()" style="display:none; margin-top: 15px;">Siguiente Palabra</button>
  </div>

  <!-- PANTALLA 3: FIN DEL JUEGO -->
  <div id="end-screen">
    <h2>¡Desafío Finalizado!</h2>
    <p style="color: var(--muted);">Has completado la evaluación corporativa.</p>
    
    <div class="summary-card">
      <div>Aciertos Totales</div>
      <div class="summary-score" id="final-score">0 / 0</div>
      <div id="final-message" style="font-size: 0.9rem; color: var(--muted);"></div>
    </div>

    <button class="btn" onclick="location.reload()">Registrar Nuevo Usuario</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://qvnuayqlfaaagwxgxmsc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2bnVheXFsZmFhYWd3eGd4bXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODM0ODUsImV4cCI6MjEwMDQ1OTQ4NX0.0C43m8BmhxFDZ5oqKCoUwASWYl6rG67-JrieiMLTVMs';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const procesosData = [
    { n: "Gestión Humana", s: ["Gestión Humana", "Seguridad y Salud en el Trabajo", "Nómina"] },
    { n: "Administración", s: ["Servicios Generales", "Activos Fijos", "Gestión Documental", "Sistemas", "Mantenimiento", "Administrativo"] },
    { n: "Mejora Continua", s: ["Auditoría", "Calidad", "Cumplimiento"] },
    { n: "Suministros", s: ["Compras Suministros", "Logística Suministros", "Cartera", "Ventas"] },
    { n: "Alumbrado Público", s: ["Atención al Usuario", "Iluminación", "Compras AP", "SIG", "Logística AP", "Medio Ambiente"] },
    { n: "Proyectos", s: ["Proyectos Planeación", "Proyectos Ejecución", "Proyectos Cierre", "Proyectos Administrativo"] }
  ];

  const procesoSelect = document.getElementById('proceso');
  const subprocesoSelect = document.getElementById('subproceso');

  procesosData.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.n;
    opt.textContent = p.n;
    procesoSelect.appendChild(opt);
  });

  procesoSelect.addEventListener('change', (e) => {
    const selectedName = e.target.value;
    const procesoObj = procesosData.find(p => p.n === selectedName);

    subprocesoSelect.innerHTML = '';

    if (procesoObj && procesoObj.s && procesoObj.s.length > 0) {
      subprocesoSelect.disabled = false;
      const defaultOpt = document.createElement('option');
      defaultOpt.value = "";
      defaultOpt.disabled = true;
      defaultOpt.selected = true;
      defaultOpt.textContent = "Seleccione un subproceso...";
      subprocesoSelect.appendChild(defaultOpt);

      procesoObj.s.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.textContent = sub;
        subprocesoSelect.appendChild(opt);
      });
    } else {
      subprocesoSelect.disabled = false;
      const opt = document.createElement('option');
      opt.value = "N/A";
      opt.textContent = "Sin subprocesos aplicables";
      opt.selected = true;
      subprocesoSelect.appendChild(opt);
    }
  });

  // NUEVO DICCIONARIO CORPORATIVO
  const dictionary = [
    { 
      word: "BUK", 
      type: "Herramienta", 
      clue: "Plataforma implementada para gestionar procesos relacionados con los colaboradores." 
    },
    { 
      word: "EXATI", 
      type: "Software", 
      clue: "Herramienta que centraliza y optimiza la gestión del alumbrado público." 
    },
    { 
      word: "TRAZABILIDAD", 
      type: "Concepto", 
      clue: "Permite hacer seguimiento a cada etapa de un proceso." 
    },
    { 
      word: "ESTANDARIZACION", 
      type: "Concepto", 
      clue: "Busca establecer formas organizadas y comunes de gestionar los procesos." 
    },
    { 
      word: "PREVENCION", 
      type: "Concepto", 
      clue: "Busca anticiparse a los riesgos y fortalecer la seguridad." 
    }
  ];

  let currentRecordId = null;
  let remainingIndices = [];
  let currentRound = 0;
  let score = 0;
  let selected, guessed, errors, parts;

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('start-btn');
    btn.innerText = "Registrando...";
    btn.disabled = true;

    const nombre = document.getElementById('nombre').value.trim();
    const proceso = procesoSelect.value;
    const subproceso = subprocesoSelect.value;

    try {
      const { data, error } = await supabaseClient
        .from('juego_ahorcado')
        .insert([{ 
          nombre: nombre, 
          area: proceso, 
          subarea: subproceso, 
          estado: 'En Progreso' 
        }])
        .select();

      if (error) throw error;

      if (data && data.length > 0) {
        currentRecordId = data[0].id;
      }

      remainingIndices = dictionary.map((_, index) => index);
      currentRound = 0;
      score = 0;

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      
      nextWord();

    } catch (err) {
      alert("Error con la base de datos: " + err.message);
      btn.innerText = "Iniciar Desafío";
      btn.disabled = false;
    }
  });

  function nextWord() {
    if (remainingIndices.length === 0) {
      finishGame();
      return;
    }

    currentRound++;
    const randomIndex = Math.floor(Math.random() * remainingIndices.length);
    const selectedIndex = remainingIndices.splice(randomIndex, 1)[0];
    
    selected = dictionary[selectedIndex];
    guessed = [];
    errors = 0;
    parts = document.querySelectorAll('.figure-part');
    
    parts.forEach(p => p.style.display = 'none');
    document.getElementById('game-progress').innerText = `Palabra ${currentRound} de ${dictionary.length}`;
    document.getElementById('clue').innerText = `[${selected.type}] Pista: "${selected.clue}"`;
    document.getElementById('status').innerText = '';
    document.getElementById('next-btn').style.display = 'none';

    renderWord();
    renderKeyboard();
  }

  function renderWord() {
    const display = document.getElementById('word-display');
    display.innerHTML = selected.word.split('').map(letter => `
      <div class="letter-slot">${guessed.includes(letter) ? letter : ''}</div>
    `).join('');

    if (!selected.word.split('').some(l => !guessed.includes(l))) {
      score++;
      document.getElementById('status').innerText = "¡Excelente! Palabra superada.";
      document.getElementById('status').style.color = "var(--success)";
      disableKeyboard();
      showNextButton();
    }
  }

  function renderKeyboard() {
    const keyboard = document.getElementById('keyboard');
    keyboard.innerHTML = '';
    "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('').forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.innerText = letter;
      btn.id = `key-${letter}`;
      btn.onclick = () => handleGuess(letter, btn);
      keyboard.appendChild(btn);
    });
  }

  function handleGuess(letter, btn) {
    if (!btn || btn.disabled) return;

    btn.disabled = true;
    if (selected.word.includes(letter)) {
      btn.classList.add('correct');
      guessed.push(letter);
      renderWord();
    } else {
      btn.classList.add('wrong');
      if (errors < parts.length) {
        parts[errors].style.display = 'block';
        errors++;
      }
      if (errors === parts.length) {
        document.getElementById('status').innerText = `Fallo. La palabra era: ${selected.word}`;
        document.getElementById('status').style.color = "var(--error)";
        disableKeyboard();
        showNextButton();
      }
    }
  }

  function showNextButton() {
    const btn = document.getElementById('next-btn');
    if (remainingIndices.length === 0) {
      btn.innerText = "Ver Resumen Final";
    } else {
      btn.innerText = "Siguiente Palabra";
    }
    btn.style.display = 'block';
  }

  function disableKeyboard() {
    document.querySelectorAll('.key').forEach(btn => btn.disabled = true);
  }

  document.addEventListener('keydown', (e) => {
    const gameScreen = document.getElementById('game-screen');
    if (getComputedStyle(gameScreen).display === 'none') return;

    const pressedKey = e.key.toUpperCase();

    if (/^[A-ZÑ]$/.test(pressedKey)) {
      const targetBtn = document.getElementById(`key-${pressedKey}`);
      if (targetBtn && !targetBtn.disabled) {
        handleGuess(pressedKey, targetBtn);
      }
    }
  });

  async function finishGame() {
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';

    document.getElementById('final-score').innerText = `${score} / ${dictionary.length}`;
    
    let msg = "";
    if (score === dictionary.length) msg = "¡Rendimiento perfecto! Excelente dominio corporativo.";
    else if (score >= 3) msg = "Buen desempeño general.";
    else msg = "Se sugiere repasar las herramientas y conceptos institucionales.";
    
    document.getElementById('final-message').innerText = msg;

    if (currentRecordId) {
      try {
        await supabaseClient
          .from('juego_ahorcado')
          .update({ 
            estado: 'Finalizado',
            errores: score 
          })
          .eq('id', currentRecordId);
      } catch (e) {
        console.error("Error al actualizar estado final:", e);
      }
    }
  }
</script>
</body>
</html>
