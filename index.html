<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electroingeniería - Desafío Corporativo</title>
  <!-- Cliente JS Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0033A0;
      --primary-dark: #002266;
      --yellow: #FFC700;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 520px;
      width: 100%;
      text-align: center;
      border-top: 6px solid var(--primary);
    }

    /* Branding Electroingeniería */
    .brand-header {
      margin-bottom: 2rem;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      margin: 0;
      text-transform: lowercase;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: var(--primary);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--yellow);
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-transform: lowercase;
      font-weight: 600;
    }

    /* Formularios */
    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 51, 160, 0.3);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 1rem;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.99);
    }

    /* Pantalla del juego */
    #game-screen { display: none; }

    .clue {
      color: var(--muted);
      font-style: italic;
      margin-bottom: 1.5rem;
      min-height: 48px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    #svg-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem auto;
    }

    line, circle {
      stroke: var(--text);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
    }

    .figure-part { display: none; }

    .word-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .letter-slot {
      border-bottom: 3px solid var(--yellow);
      width: 30px;
      height: 40px;
      font-size: 1.7rem;
      font-weight: bold;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .key {
      background: #0f172a;
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px 13px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .key:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
    }

    .key:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .key.correct {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .key.wrong {
      background: var(--error);
      border-color: var(--error);
      color: white;
    }

    .status {
      margin-top: 1.5rem;
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Cabecera Institucional -->
  <div class="brand-header">
    <h1 class="brand-title">electro<span>ingeniería</span></h1>
    <div class="brand-subtitle">trabajando con buena energía</div>
  </div>

  <!-- PANTALLA 1: REGISTRO/LOGIN -->
  <div id="login-screen">
    <form id="login-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="area">Área</label>
        <input type="text" id="area" placeholder="Ej. Operaciones, TI, Gestión Humana" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="subarea">Subárea / Cargo</label>
        <input type="text" id="subarea" placeholder="Ej. Mantenimiento, Desarrollo" required autocomplete="off">
      </div>

      <button type="submit" class="btn" id="start-btn">Iniciar Desafío</button>
    </form>
  </div>

  <!-- PANTALLA 2: LÓGICA DEL JUEGO -->
  <div id="game-screen">
    <div class="clue" id="clue">Cargando pista...</div>

    <svg id="svg-container" viewBox="0 0 100 100">
      <!-- Estructura del ahorcado -->
      <line x1="10" y1="95" x2="90" y2="95" />
      <line x1="30" y1="95" x2="30" y2="5" />
      <line x1="30" y1="5" x2="70" y2="5" />
      <line x1="70" y1="5" x2="70" y2="20" />

      <!-- Partes del monigote (6 errores permitidos) -->
      <circle cx="70" cy="28" r="8" class="figure-part" />
      <line x1="70" y1="36" x2="70" y2="60" class="figure-part" />
      <line x1="70" y1="45" x2="55" y2="55" class="figure-part" />
      <line x1="70" y1="45" x2="85" y2="55" class="figure-part" />
      <line x1="70" y1="60" x2="55" y2="80" class="figure-part" />
      <line x1="70" y1="60" x2="85" y2="80" class="figure-part" />
    </svg>

    <div class="word-display" id="word-display"></div>
    <div class="keyboard" id="keyboard"></div>
    <div class="status" id="status"></div>
    <button class="btn" id="reset-btn" onclick="initGame()" style="display:none; margin-top: 15px;">Siguiente Palabra</button>
  </div>
</div>

<script>
  // CREDENCIALES DE SUPABASE
  const SUPABASE_URL = 'https://qvnuayqlfaaagwxgxmsc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2bnVheXFsZmFhYWd3eGd4bXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODM0ODUsImV4cCI6MjEwMDQ1OTQ4NX0.0C43m8BmhxFDZ5oqKCoUwASWYl6rG67-JrieiMLTVMs';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // BASE DE DATOS LOCAL DE PALABRAS
  const dictionary = [
    { word: "ENERGIA", clue: "Capacidad para realizar un trabajo o transformar el entorno." },
    { word: "SEGURIDAD", clue: "Condición indispensable para preservar la integridad operativa." },
    { word: "EFICIENCIA", clue: "Logro de los objetivos maximizando los recursos disponibles." },
    { word: "INNOVACION", clue: "Transformación de ideas en valor tangible para la organización." },
    { word: "INGENIERIA", clue: "Aplicación sistemática de principios científicos a la solución técnica." }
  ];

  let currentRecordId = null;
  let selected, guessed, errors, parts;

  // CAPTURA DE REGISTRO E INSERCIÓN EN TABLA: juego_ahorcado
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('start-btn');
    btn.innerText = "Registrando...";
    btn.disabled = true;

    const nombre = document.getElementById('nombre').value.trim();
    const area = document.getElementById('area').value.trim();
    const subarea = document.getElementById('subarea').value.trim();

    try {
      // Inserción inicial en la tabla 'juego_ahorcado'
      const { data, error } = await supabaseClient
        .from('juego_ahorcado')
        .insert([{ 
          nombre: nombre, 
          area: area, 
          subarea: subarea, 
          estado: 'Iniciado' 
        }])
        .select();

      if (error) throw error;

      if (data && data.length > 0) {
        currentRecordId = data[0].id;
      }

      // Despliegue de la interfaz de juego
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      initGame();

    } catch (err) {
      alert("Fallo de comunicación con la base de datos: " + err.message);
      btn.innerText = "Iniciar Desafío";
      btn.disabled = false;
    }
  });

  function initGame() {
    selected = dictionary[Math.floor(Math.random() * dictionary.length)];
    guessed = [];
    errors = 0;
    parts = document.querySelectorAll('.figure-part');
    
    parts.forEach(p => p.style.display = 'none');
    document.getElementById('clue').innerText = `Pista: "${selected.clue}"`;
    document.getElementById('status').innerText = '';
    document.getElementById('reset-btn').style.display = 'none';

    renderWord();
    renderKeyboard();
  }

  function renderWord() {
    const display = document.getElementById('word-display');
    display.innerHTML = selected.word.split('').map(letter => `
      <div class="letter-slot">${guessed.includes(letter) ? letter : ''}</div>
    `).join('');

    // Condición de victoria
    if (!selected.word.split('').some(l => !guessed.includes(l))) {
      document.getElementById('status').innerText = "¡Excelente! Desafío superado.";
      document.getElementById('status').style.color = "var(--success)";
      disableKeyboard();
      updateDatabase('Completado');
      document.getElementById('reset-btn').style.display = 'block';
    }
  }

  function renderKeyboard() {
    const keyboard = document.getElementById('keyboard');
    keyboard.innerHTML = '';
    "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('').forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.innerText = letter;
      btn.onclick = () => handleGuess(letter, btn);
      keyboard.appendChild(btn);
    });
  }

  function handleGuess(letter, btn) {
    btn.disabled = true;
    if (selected.word.includes(letter)) {
      btn.classList.add('correct');
      guessed.push(letter);
      renderWord();
    } else {
      btn.classList.add('wrong');
      if (errors < parts.length) {
        parts[errors].style.display = 'block';
        errors++;
      }
      // Condición de derrota
      if (errors === parts.length) {
        document.getElementById('status').innerText = `Fallo crítico. La palabra era: ${selected.word}`;
        document.getElementById('status').style.color = "var(--error)";
        disableKeyboard();
        updateDatabase('Fallado');
        document.getElementById('reset-btn').style.display = 'block';
      }
    }
  }

  function disableKeyboard() {
    document.querySelectorAll('.key').forEach(btn => btn.disabled = true);
  }

  // ACTUALIZACIÓN DEL ESTADO EN SUPABASE EN TIEMPO REAL
  async function updateDatabase(finalState) {
    if (!currentRecordId) return;
    try {
      await supabaseClient
        .from('juego_ahorcado')
        .update({ 
          estado: finalState, 
          palabra: selected.word, 
          errores: errors 
        })
        .eq('id', currentRecordId);
    } catch (e) {
      console.error("Error al sincronizar con Supabase:", e);
    }
  }
</script>
</body>
</html>
