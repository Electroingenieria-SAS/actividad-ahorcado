<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafío Corporativo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #64748b;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 { margin-top: 0; color: var(--accent); }
    .clue { color: var(--muted); font-style: italic; margin-bottom: 1.5rem; min-height: 48px; }

    /* Dibujo SVG */
    #svg-container {
      width: 150px;
      height: 150px;
      margin: 0 auto 1.5rem auto;
    }
    line, circle {
      stroke: var(--text);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
    }
    .figure-part { display: none; }

    /* Palabra */
    .word-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .letter-slot {
      border-bottom: 3px solid var(--accent);
      width: 30px;
      height: 40px;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Teclado */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .key {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--muted);
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .key:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .key:disabled { opacity: 0.3; cursor: not-allowed; }
    .key.correct { background: var(--success); border-color: var(--success); color: white; }
    .key.wrong { background: var(--error); border-color: var(--error); color: white; }

    /* Estado del juego */
    .status { margin-top: 1.5rem; font-weight: bold; font-size: 1.2rem; }
    .reset-btn {
      margin-top: 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Reto Corporativo</h1>
  <div class="clue" id="clue">Cargando pista...</div>

  <svg id="svg-container" viewBox="0 0 100 100">
    <!-- Base y Horca -->
    <line x1="10" y1="95" x2="90" y2="95" />
    <line x1="30" y1="95" x2="30" y2="5" />
    <line x1="30" y1="5" x2="70" y2="5" />
    <line x1="70" y1="5" x2="70" y2="20" />

    <!-- Partes del cuerpo (6 intentos) -->
    <circle cx="70" cy="28" r="8" class="figure-part" /> <!-- Cabeza -->
    <line x1="70" y1="36" x2="70" y2="60" class="figure-part" /> <!-- Torso -->
    <line x1="70" y1="45" x2="55" y2="55" class="figure-part" /> <!-- Brazo Izq -->
    <line x1="70" y1="45" x2="85" y2="55" class="figure-part" /> <!-- Brazo Der -->
    <line x1="70" y1="60" x2="55" y2="80" class="figure-part" /> <!-- Pierna Izq -->
    <line x1="70" y1="60" x2="85" y2="80" class="figure-part" /> <!-- Pierna Der -->
  </svg>

  <div class="word-display" id="word-display"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="status" id="status"></div>
  <button class="reset-btn" id="reset-btn" onclick="initGame()" style="display:none;">Siguiente Palabra</button>
</div>

<script>
  // MODIFICA AQUÍ TUS PALABRAS Y PISTAS CORPORATIVAS
  const dictionary = [
    { word: "SINERGIA", clue: "Acción coordinada de varios órganos o sistemas que incrementa la eficacia." },
    { word: "INNOVACION", clue: "Transformación de ideas en valor tangible para la organización." },
    { word: "LIDERAZGO", clue: "Capacidad de guiar y articular esfuerzos hacia un objetivo común." },
    { word: "ESTRATEGIA", clue: "Plan estructurado para alcanzar metas a largo plazo bajo incertidumbre." }
  ];

  let selected, guessed, errors, parts;

  function initGame() {
    selected = dictionary[Math.floor(Math.random() * dictionary.length)];
    guessed = [];
    errors = 0;
    parts = document.querySelectorAll('.figure-part');
    
    parts.forEach(p => p.style.display = 'none');
    document.getElementById('clue').innerText = `Pista: "${selected.clue}"`;
    document.getElementById('status').innerText = '';
    document.getElementById('reset-btn').style.display = 'none';

    renderWord();
    renderKeyboard();
  }

  function renderWord() {
    const display = document.getElementById('word-display');
    display.innerHTML = selected.word.split('').map(letter => `
      <div class="letter-slot">${guessed.includes(letter) ? letter : ''}</div>
    `).join('');

    if (!selected.word.split('').some(l => !guessed.includes(l))) {
      document.getElementById('status').innerText = "¡Objetivo cumplido! Has descifrado el concepto.";
      document.getElementById('status').style.color = "var(--success)";
      disableKeyboard();
      document.getElementById('reset-btn').style.display = 'inline-block';
    }
  }

  function renderKeyboard() {
    const keyboard = document.getElementById('keyboard');
    keyboard.innerHTML = '';
    "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('').forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.innerText = letter;
      btn.onclick = () => handleGuess(letter, btn);
      keyboard.appendChild(btn);
    });
  }

  function handleGuess(letter, btn) {
    btn.disabled = true;
    if (selected.word.includes(letter)) {
      btn.classList.add('correct');
      guessed.push(letter);
      renderWord();
    } else {
      btn.classList.add('wrong');
      if (errors < parts.length) {
        parts[errors].style.display = 'block';
        errors++;
      }
      if (errors === parts.length) {
        document.getElementById('status').innerText = `Fallo de ejecución. La palabra era: ${selected.word}`;
        document.getElementById('status').style.color = "var(--error)";
        disableKeyboard();
        document.getElementById('reset-btn').style.display = 'inline-block';
      }
    }
  }

  function disableKeyboard() {
    document.querySelectorAll('.key').forEach(btn => btn.disabled = true);
  }

  initGame();
</script>
</body>
</html>
